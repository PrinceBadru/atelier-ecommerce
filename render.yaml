databases:
  - name: atelier-db
    databaseName: atelier
    user: atelier_user
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: atelier-web
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: atelier-web
          property: host
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: atelier-web
          property: host
      - key: AI_MODEL_MAIN
        value: gemini-2.5-flash
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
