version: "1"

databases:
  - name: atelier-db
    databaseName: atelier
    databaseUser: atelier_user
    plan: free

services:
  - type: web
    name: atelier-web
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AI_MODEL_MAIN
        value: gemini-2.5-flash
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
